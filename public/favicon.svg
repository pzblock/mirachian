<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <g>
    <animateTransform
      attributeName="transform"
      type="rotate"
      from="0 16 16"
      to="360 16 16"
      dur="14s"
      repeatCount="indefinite"
    />
    <g transform="translate(16 16)">
      <g>
        <animateTransform
          attributeName="transform"
          type="scale"
          values="1;1.12;1"
          keyTimes="0;0.5;1"
          dur="2.6s"
          repeatCount="indefinite"
          calcMode="spline"
          keySplines="0.22 1 0.36 1;0.22 1 0.36 1"
        />
        <circle cx="0" cy="0" r="11" fill="none" stroke="#234a6a" stroke-width="1.75">
          <animate
            attributeName="opacity"
            values="0.85;1;0.85"
            keyTimes="0;0.5;1"
            dur="2.6s"
            repeatCount="indefinite"
            calcMode="spline"
            keySplines="0.22 1 0.36 1;0.22 1 0.36 1"
          />
        </circle>
      </g>
      <g>
        <animateTransform
          attributeName="transform"
          type="scale"
          values="1;0.84;1"
          keyTimes="0;0.5;1"
          dur="2.6s"
          repeatCount="indefinite"
          calcMode="spline"
          keySplines="0.22 1 0.36 1;0.22 1 0.36 1"
        />
        <circle cx="0" cy="0" r="6.2" fill="none" stroke="#234a6a" stroke-width="1.25">
          <animate
            attributeName="opacity"
            values="1;0.7;1"
            keyTimes="0;0.5;1"
            dur="2.6s"
            repeatCount="indefinite"
            calcMode="spline"
            keySplines="0.22 1 0.36 1;0.22 1 0.36 1"
          />
        </circle>
      </g>
      <line
        x1="-6.4"
        y1="0"
        x2="6.4"
        y2="0"
        stroke="#234a6a"
        stroke-width="1.25"
        stroke-linecap="square"
      />
    </g>
  </g>
</svg>
